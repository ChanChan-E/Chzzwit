<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>test2_center</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; color: #eee; background: #111; }

    .topbar {
      height: 58px;
      background: #1a1a6e;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }
    .topbar-left { display: flex; align-items: center; gap: 10px; }
    .topbar-right { display: flex; align-items: center; gap: 10px; }

    .layout {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      height: calc(100vh - 58px);
    }
    .col-left   { background: #006400; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .col-center { background: #4a0000; padding: 16px; overflow-y: auto; }
    .col-right  { background: #00008b; padding: 16px; overflow-y: auto; }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-left">
      <button>&#9776;</button>
      <span>Chzzwit</span>
    </div>
    <div class="topbar-right">
      <a href="vod.html" style="color:#fff">VOD</a>
      <button>팔로우 가져오기 (확장프로그램 설치)</button>
    </div>
  </header>

  <div class="layout">

    <div class="col-left">
      <p style="font-size:11px;opacity:.6">채널 추가</p>
      <input type="text" placeholder="채널명으로 검색…" style="width:100%;padding:6px;background:#111;border:1px solid #444;color:#eee;border-radius:4px" />
      <p style="font-size:11px;opacity:.6;margin-top:8px">채널 0 / 0</p>
    </div>

    <div class="col-center">
      <p style="text-align:center;margin-top:60px;opacity:.6">아직 추가된 채널이 없어요</p>
      <p style="text-align:center;margin-top:8px;font-size:13px;opacity:.4">왼쪽에서 채널을 검색해 추가하면 커뮤니티 글이 여기 모여요.</p>
      <div id="cards"></div>
    </div>

    <div class="col-right">RIGHT</div>

  </div>

  <script>
    const cards = document.getElementById('cards');
    for (let i = 1; i <= 20; i++) {
      const d = document.createElement('div');
      d.style.cssText = 'margin:12px 0;padding:16px;background:#333;border-radius:8px;';
      d.textContent = '피드 카드 #' + i;
      cards.appendChild(d);
    }
  </script>

</body>
</html>
