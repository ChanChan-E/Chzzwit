<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chzzwit</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="style.css?v=13" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    .topbar {
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }

    .layout {
      display: grid;
      grid-template-columns: 260px 1fr 220px;
      height: calc(100vh - 58px);
    }

    .sidebar  { overflow-y: auto; }
    .feed-wrap { overflow-y: auto; }
    .right-panel  {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
      padding: 18px 14px;
      border-left: 1px solid var(--border);
      background: var(--surface);
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <button id="btn-toggle-sidebar" class="btn-sidebar-toggle" aria-label="사이드바">&#9776;</button>
      <span class="brand-mark"></span>
      <span class="brand-text">Chzzw<strong>it</strong></span>
    </div>
    <div class="topbar-right">
      <a href="vod.html" class="btn-nav-link">VOD</a>
      <button id="btn-connect-ext" class="btn-ext" aria-label="확장프로그램으로 팔로우 가져오기">
        <span class="btn-ext-dot"></span>
        <span class="btn-ext-text">팔로우 가져오기 (확장프로그램 설치)</span>
      </button>
    </div>
  </header>

  <div class="layout">

    <aside class="sidebar">
      <div class="sidebar-section">
        <label class="sidebar-label">채널 추가</label>
        <div class="search-box">
          <input id="channel-search-input" type="text" placeholder="채널명으로 검색…" autocomplete="off" />
        </div>
        <ul id="search-results" class="search-results" hidden></ul>
      </div>
      <div class="sidebar-section sidebar-section-grow">
        <div class="sidebar-label-row">
          <label class="sidebar-label">채널 <span id="channel-selected-count" class="mono">0</span> / <span id="channel-total-count" class="mono">0</span></label>
          <div class="vod-channel-actions">
            <button id="btn-select-all-ch" class="link-btn">전체</button>
            <button id="btn-deselect-all-ch" class="link-btn">해제</button>
          </div>
        </div>
        <ul id="my-channels" class="vod-channel-list"></ul>
      </div>
    </aside>

    <main class="feed-wrap">
      <div id="feed-empty" class="feed-state">
        <p class="feed-state-title">아직 추가된 채널이 없어요</p>
        <p class="feed-state-sub">왼쪽에서 채널을 검색해 추가하면 커뮤니티 글이 여기 모여요.</p>
      </div>
      <div id="feed-loading" class="feed-state" hidden>
        <div class="spinner"></div>
        <p class="feed-state-sub">피드를 불러오는 중…</p>
      </div>
      <div id="feed-error" class="feed-state" hidden>
        <p class="feed-state-title">불러오지 못했어요</p>
        <p id="feed-error-msg" class="feed-state-msg"></p>
      </div>
      <ul id="feed-list" class="feed-list" hidden></ul>
      <div id="feed-sentinel"></div>
    </main>

    <aside class="right-panel">
      <div class="donate-card">
        <div class="donate-icon">☕</div>
        <p class="donate-title">서비스가 도움이 됐나요?</p>
        <p class="donate-desc">운영비·개발비에 큰 힘이 됩니다.</p>
        <a class="donate-btn" href="https://toon.at/donate/chanchan2" target="_blank" rel="noopener noreferrer">
          투네이션으로 응원하기
        </a>
      </div>
      <div class="ad-slot ad-slot-square"><span>AD · 200×200</span></div>
      <div class="ad-slot ad-slot-tall"><span>AD · 200×400</span></div>
    </aside>

  </div>

  <div id="sidebar-backdrop" class="sidebar-backdrop"></div>
  <div id="toast" class="toast" hidden></div>
  <div id="img-lightbox" class="img-lightbox" hidden>
    <img id="img-lightbox-img" src="" alt="" />
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
