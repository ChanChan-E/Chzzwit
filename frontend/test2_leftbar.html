<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>test2_leftbar</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; color: #eee; background: #111; }

    .topbar {
      height: 58px;
      background: #1a1a6e;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }
    .topbar-left { display: flex; align-items: center; gap: 10px; }
    .topbar-right { display: flex; align-items: center; gap: 10px; }

    .layout {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      height: calc(100vh - 58px);
    }
    .col-left   { background: #006400; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .col-center { background: #4a0000; padding: 16px; overflow-y: auto; }
    .col-right  { background: #00008b; padding: 16px; overflow-y: auto; }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-left">
      <button>&#9776;</button>
      <span>Chzzwit</span>
    </div>
    <div class="topbar-right">
      <a href="vod.html" style="color:#fff">VOD</a>
      <button>팔로우 가져오기 (확장프로그램 설치)</button>
    </div>
  </header>

  <div class="layout">

    <div class="col-left">
      <p style="font-size:11px;opacity:.6">채널 추가</p>
      <input type="text" placeholder="채널명으로 검색…" style="width:100%;padding:6px;background:#111;border:1px solid #444;color:#eee;border-radius:4px" />
      <p style="font-size:11px;opacity:.6;margin-top:8px">채널 0 / 0</p>
      <ul style="list-style:none;margin-top:4px">
        <li style="padding:6px 0;opacity:.5">채널 없음</li>
      </ul>
    </div>

    <div class="col-center">CENTER</div>
    <div class="col-right">RIGHT</div>

  </div>

</body>
</html>
