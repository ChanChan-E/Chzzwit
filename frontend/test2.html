<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>test2</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; color: #eee; background: #111; }

    .topbar {
      height: 58px;
      background: #1a1a6e;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      height: calc(100vh - 58px);
    }

    .col-left   { background: #006400; padding: 16px; overflow-y: auto; }
    .col-center { background: #4a0000; padding: 16px; overflow-y: auto; }
    .col-right  { background: #00008b; padding: 16px; overflow-y: auto; }
  </style>
</head>
<body>

  <div class="topbar">
    <span>&#9776; &nbsp; Chzzwit</span>
    <span>VOD &nbsp; | &nbsp; 팔로우 가져오기</span>
  </div>

  <div class="layout">

    <div class="col-left">
      <p>채널 추가</p>
      <input type="text" placeholder="채널명으로 검색…" style="width:100%;margin-top:8px;padding:6px" />
      <p style="margin-top:16px">채널 목록</p>
    </div>

    <div class="col-center">
      <p>피드</p>
      <p style="margin-top:8px;font-size:13px;opacity:.6">아직 추가된 채널이 없어요</p>
    </div>

    <div class="col-right">
      <p>☕ 투네이션</p>
      <p style="margin-top:8px;font-size:12px;opacity:.7">AD 200×200</p>
      <p style="margin-top:8px;font-size:12px;opacity:.7">AD 200×400</p>
    </div>

  </div>

</body>
</html>
