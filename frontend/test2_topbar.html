<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>test2_topbar</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; color: #eee; background: #111; }

    .topbar {
      height: 58px;
      background: #1a1a6e;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }
    .topbar-left { display: flex; align-items: center; gap: 10px; }
    .topbar-right { display: flex; align-items: center; gap: 10px; }

    .layout {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      height: calc(100vh - 58px);
    }
    .col-left   { background: #006400; padding: 16px; overflow-y: auto; }
    .col-center { background: #4a0000; padding: 16px; overflow-y: auto; }
    .col-right  { background: #00008b; padding: 16px; overflow-y: auto; }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-left">
      <button>&#9776;</button>
      <span>Chzzwit</span>
    </div>
    <div class="topbar-right">
      <a href="vod.html" style="color:#fff">VOD</a>
      <button>팔로우 가져오기 (확장프로그램 설치)</button>
    </div>
  </header>

  <div class="layout">
    <div class="col-left">LEFT</div>
    <div class="col-center">CENTER</div>
    <div class="col-right">RIGHT</div>
  </div>

</body>
</html>
