<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Layout Test</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; color: #eee; background: #111; }

    /* 상단바 */
    .topbar {
      height: 58px;
      background: #1a1a6e;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      color: #fff;
    }

    /* 3컬럼 그리드 */
    .layout {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      height: calc(100vh - 58px);
    }

    /* 좌측 */
    .sidebar {
      background: #006400;
      padding: 16px;
      overflow-y: auto;
    }

    /* 중앙 */
    .feed-wrap {
      background: #4a0000;
      padding: 16px;
      overflow-y: auto;
    }

    /* 우측 */
    .ad-rail {
      background: #00008b;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }
    .ad-rail p, .ad-rail span { color: #fff; font-size: 13px; }
  </style>
</head>
<body>

  <header class="topbar">
    <div>
      <button>&#9776;</button>
      <strong style="margin-left:10px">Chzzwit</strong>
    </div>
    <div>
      <a href="vod.html" style="color:#fff;margin-right:12px">VOD</a>
      <button>팔로우 가져오기</button>
    </div>
  </header>

  <div class="layout">

    <aside class="sidebar">
      <p>채널 추가</p>
      <input type="text" placeholder="채널명으로 검색…" style="width:100%;margin-top:8px;padding:6px" />
      <p style="margin-top:16px">채널 목록</p>
    </aside>

    <main class="feed-wrap">
      <p>피드 영역</p>
      <p style="margin-top:8px;font-size:13px;opacity:.6">아직 추가된 채널이 없어요</p>
    </main>

    <aside class="ad-rail">
      <p>☕ 투네이션 카드</p>
      <span>AD 200×200</span>
      <span>AD 200×400</span>
    </aside>

  </div>

</body>
</html>
