<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3분할 테스트</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; }

    .wrap {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      height: 100vh;
    }
    .a { background: red;   display: flex; align-items: center; justify-content: center; color: #fff; font-size: 24px; }
    .b { background: green; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 24px; }
    .c { background: blue;  display: flex; align-items: center; justify-content: center; color: #fff; font-size: 24px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="a">LEFT</div>
    <div class="b">CENTER</div>
    <div class="c">RIGHT</div>
  </div>
</body>
</html>
