<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>test2_rightbar</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; color: #eee; background: #111; }

    .topbar {
      height: 58px;
      background: #1a1a6e;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }
    .topbar-left { display: flex; align-items: center; gap: 10px; }
    .topbar-right { display: flex; align-items: center; gap: 10px; }

    .layout {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      height: calc(100vh - 58px);
    }
    .col-left   { background: #006400; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .col-center { background: #4a0000; padding: 16px; overflow-y: auto; }
    .col-right  { background: #00008b; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; align-items: center; }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-left">
      <button>&#9776;</button>
      <span>Chzzwit</span>
    </div>
    <div class="topbar-right">
      <a href="vod.html" style="color:#fff">VOD</a>
      <button>팔로우 가져오기 (확장프로그램 설치)</button>
    </div>
  </header>

  <div class="layout">

    <div class="col-left">
      <p style="font-size:11px;opacity:.6">채널 추가</p>
      <input type="text" placeholder="채널명으로 검색…" style="width:100%;padding:6px;background:#111;border:1px solid #444;color:#eee;border-radius:4px" />
      <p style="font-size:11px;opacity:.6;margin-top:8px">채널 0 / 0</p>
    </div>

    <div class="col-center">
      <p style="text-align:center;margin-top:60px;opacity:.6">아직 추가된 채널이 없어요</p>
      <div id="cards"></div>
    </div>

    <div class="col-right">
      <div style="width:100%;background:#ffffff22;border:1px solid #fff4;border-radius:8px;padding:16px;text-align:center">
        <p style="font-size:20px">☕</p>
        <p style="font-size:13px;font-weight:600;margin-top:6px">서비스가 도움이 됐나요?</p>
        <p style="font-size:12px;opacity:.6;margin-top:4px">운영비·개발비에 큰 힘이 됩니다.</p>
        <a href="https://toon.at/donate/chanchan2" target="_blank" style="display:block;margin-top:10px;padding:8px;background:#00f0a8;color:#000;border-radius:6px;font-size:13px;text-decoration:none;font-weight:600">투네이션으로 응원하기</a>
      </div>
      <div style="width:100%;aspect-ratio:1/1;border:1px dashed #fff4;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;opacity:.4">AD 200×200</div>
      <div style="width:100%;aspect-ratio:1/2;border:1px dashed #fff4;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;opacity:.4">AD 200×400</div>
    </div>

  </div>

  <script>
    const cards = document.getElementById('cards');
    for (let i = 1; i <= 20; i++) {
      const d = document.createElement('div');
      d.style.cssText = 'margin:12px 0;padding:16px;background:#333;border-radius:8px;';
      d.textContent = '피드 카드 #' + i;
      cards.appendChild(d);
    }
  </script>

</body>
</html>
