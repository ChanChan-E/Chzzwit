<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chzzwit — VOD</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="style.css?v=6" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <button id="btn-toggle-sidebar" class="btn-sidebar-toggle" aria-label="사이드바">&#9776;</button>
      <a href="/" class="brand">
        <span class="brand-mark"></span>
        <span class="brand-text">Chzzw<strong>it</strong></span>
      </a>
    </div>
    <div class="topbar-center">
      <div class="vod-category-wrap">
        <input id="vod-category-input" class="vod-filter-input" type="text" placeholder="카테고리…" autocomplete="off" />
        <ul id="vod-category-suggestions" class="vod-autocomplete" hidden></ul>
      </div>
      <input id="vod-keyword-input" class="vod-filter-input" type="text" placeholder="제목/태그 검색…" autocomplete="off" />
      <div class="vod-view-toggle">
        <button id="btn-view-section" class="btn-view active" title="채널별 보기">채널별</button>
        <button id="btn-view-grid" class="btn-view" title="모아보기">모아보기</button>
      </div>
    </div>
    <div class="topbar-right">
      <a href="/" class="btn-nav-link">피드</a>
      <button id="btn-connect-ext" class="btn-ext" aria-label="팔로우 가져오기">
        <span class="btn-ext-dot"></span>
        <span class="btn-ext-text">팔로우 가져오기 (확장프로그램 설치)</span>
      </button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-section">
        <label class="sidebar-label">채널 추가</label>
        <div class="search-box">
          <input id="vod-channel-search-input" type="text" placeholder="채널명으로 검색…" autocomplete="off" />
        </div>
        <ul id="vod-search-results" class="search-results" hidden></ul>
      </div>
      <div class="sidebar-section sidebar-section-grow">
        <div class="sidebar-label-row">
          <label class="sidebar-label">채널 <span id="channel-selected-count" class="mono">0</span> / <span id="channel-total-count" class="mono">0</span></label>
          <div class="vod-channel-actions">
            <button id="btn-select-all" class="link-btn">전체</button>
            <button id="btn-deselect-all" class="link-btn">해제</button>
          </div>
        </div>
        <ul id="vod-channel-list" class="vod-channel-list"></ul>
      </div>
    </aside>

    <main class="vod-wrap">
      <div id="vod-empty" class="feed-state">
        <p class="feed-state-title">아직 추가된 채널이 없어요</p>
        <p class="feed-state-sub">피드에서 채널을 추가하면 VOD가 여기 모여요.</p>
      </div>
      <div id="vod-loading" class="feed-state" hidden>
        <div class="spinner"></div>
        <p class="feed-state-sub">VOD를 불러오는 중…</p>
      </div>
      <div id="vod-error" class="feed-state" hidden>
        <p class="feed-state-title">불러오지 못했어요</p>
        <p id="vod-error-msg" class="feed-state-sub"></p>
      </div>
      <ul id="vod-grid" class="vod-grid" hidden></ul>
      <div id="vod-sentinel"></div>
    </main>

  </div>

  <!-- 우측: 광고 (그리드 밖 — position:fixed로 독립 배치) -->
  <aside class="ad-rail">
    <div class="donate-card">
      <div class="donate-icon">☕</div>
      <p class="donate-title">서비스가 도움이 됐나요?</p>
      <p class="donate-desc">운영비·개발비에 큰 힘이 됩니다.</p>
      <a class="donate-btn" href="https://toon.at/donate/chanchan2" target="_blank" rel="noopener noreferrer">
        투네이션으로 응원하기
      </a>
    </div>
    <div class="ad-slot ad-slot-square"><span>AD · 200×200</span></div>
    <div class="ad-slot ad-slot-tall"><span>AD · 200×400</span></div>
  </aside>

  <div id="sidebar-backdrop" class="sidebar-backdrop"></div>
  <div id="toast" class="toast" hidden></div>

  <script src="config.js"></script>
  <script src="vod.js"></script>
</body>
</html>
